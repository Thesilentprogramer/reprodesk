<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ReproDesk</title><style>body{font:16px system-ui;background:#0c1020;color:#e9edfa;max-width:1000px;margin:40px auto;padding:0 20px}h1{font-size:2.4rem}a{color:#8dd9ff}.card{background:#18213a;border:1px solid #33405e;padding:22px;border-radius:14px;margin:16px 0}.hash{font:12px monospace;overflow-wrap:anywhere;color:#aebbd3}.paid{color:#7de5a3}.rejected{color:#ff8d8d}.pending{color:#ffd782}button{background:#6b8bff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}code{overflow-wrap:anywhere}</style></head><body><h1>ReproDesk</h1><p>Reproducible NEAR research, paid by testnet escrow after independent hash verification.</p><p>Contract: <code id="contract"></code></p><button id="refresh">Refresh chain state</button><div id="jobs">Loading…</div><script>
const contract='reprodesk.proofbounty-38909.testnet';document.querySelector('#contract').textContent=contract;
async function view(method,args={}){const bytes=new TextEncoder().encode(JSON.stringify(args));const response=await fetch('https://rpc.testnet.near.org',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:'reprodesk',method:'query',params:{request_type:'call_function',finality:'final',account_id:contract,method_name:method,args_base64:btoa(String.fromCharCode(...bytes))}})});const json=await response.json();if(json.error)throw Error(JSON.stringify(json.error));return JSON.parse(new TextDecoder().decode(new Uint8Array(json.result.result)))}
function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
async function refresh(){const root=document.querySelector('#jobs');root.textContent='Loading…';try{const jobs=await view('get_jobs');root.replaceChildren();for(const j of jobs.reverse()){const card=el('section','','card');card.append(el('h2',`#${j.id} ${j.claim_text}`),el('p',`Status: ${j.status}`,j.status),el('p',`Poster: ${j.poster} · Bounty: ${Number(j.bounty_yocto)/1e24} Ⓝ`),el('p',`Query spec: ${j.query_spec_json}`,'hash'),el('p',`Spec SHA-256: ${j.query_spec_hash}`,'hash'));for(const s of j.submissions){const box=el('div','');box.append(el('h3',`Submission ${s.id}: ${s.status}`,s.status),el('p',`Worker: ${s.worker}`),el('p',`Result SHA-256: ${s.result_hash}`,'hash'),el('p',`Verifier SHA-256: ${s.recomputed_result_hash||'pending'}`,'hash'),el('p',`Report SHA-256: ${s.report_cid_or_hash}`,'hash'));card.append(box)}root.append(card)}if(!jobs.length)root.textContent='No jobs posted yet.'}catch(e){root.textContent=`RPC error: ${e}`}}
document.querySelector('#refresh').onclick=refresh;refresh();</script></body></html>
